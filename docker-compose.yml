services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
